services:
  web:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      RVC_ENGINE_URL: http://rvc-engine:8000
      RVC_ENGINE_API_TOKEN: ${VOICEMERGE_API_TOKEN:-change-me}
    depends_on:
      rvc-engine:
        condition: service_healthy

  rvc-engine:
    restart: unless-stopped
    build:
      context: .
      dockerfile: engine/Dockerfile
    expose:
      - "8000"
    environment:
      VOICEMERGE_ENV: production
      VOICEMERGE_API_TOKEN: ${VOICEMERGE_API_TOKEN:-change-me}
      VOICEMERGE_ALLOWED_ORIGINS: ${VOICEMERGE_ALLOWED_ORIGINS:-http://localhost:3000}
      VOICEMERGE_MODEL_HOSTS: ${VOICEMERGE_MODEL_HOSTS:-huggingface.co,hf.co,drive.google.com,drive.usercontent.google.com,googleusercontent.com,pixeldrain.com,mediafire.com,weights.gg,voice-models.com}
      VOICEMERGE_SAMPLE_RATE: ${VOICEMERGE_SAMPLE_RATE:-48000}
      VOICEMERGE_DEMUCS_MODEL: ${VOICEMERGE_DEMUCS_MODEL:-htdemucs}
      VOICEMERGE_DEMUCS_SEGMENT: ${VOICEMERGE_DEMUCS_SEGMENT:-7.0}
      VOICEMERGE_DEMUCS_OVERLAP: ${VOICEMERGE_DEMUCS_OVERLAP:-0.1}
      VOICEMERGE_DEMUCS_PRECISION: ${VOICEMERGE_DEMUCS_PRECISION:-fp16}
      VOICEMERGE_MAX_GPU_GB: ${VOICEMERGE_MAX_GPU_GB:-6.5}
      VOICEMERGE_VAD_THRESHOLD: ${VOICEMERGE_VAD_THRESHOLD:-0.5}
      VOICEMERGE_VAD_PAD_MS: ${VOICEMERGE_VAD_PAD_MS:-40}
      VOICEMERGE_VAD_MAX_SPEECH_SECONDS: ${VOICEMERGE_VAD_MAX_SPEECH_SECONDS:-15}
    volumes:
      - rvc-models:/var/lib/voicemerge/models
      - rvc-jobs:/var/lib/voicemerge/jobs

volumes:
  rvc-models:
  rvc-jobs:
